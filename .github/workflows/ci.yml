name: JARVIS substrate CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  yaml-self-validate:
    name: CI workflow YAML self-validates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate ALL workflow YAML files
        run: |
          python -c "
          import yaml, pathlib, sys
          fail = 0
          for p in sorted(pathlib.Path('.github/workflows').glob('*.yml')):
              try:
                  yaml.safe_load(p.read_text())
                  print(f'  ok: {p.name}')
              except Exception as e:
                  print(f'  FAIL: {p.name}: {e}')
                  fail = 1
          for p in sorted(pathlib.Path('.github/workflows').glob('*.yaml')):
              try:
                  yaml.safe_load(p.read_text())
                  print(f'  ok: {p.name}')
              except Exception as e:
                  print(f'  FAIL: {p.name}: {e}')
                  fail = 1
          sys.exit(fail)
          "

  verify-corpus:
    name: Verify primitive corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify primitive corpus integrity
        run: python verify/verify_primitive_corpus.py
      - name: Verify no secrets leaked
        run: python verify/verify_no_secrets.py

  layer8-audit:
    name: Layer 8 link-rot audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Layer 8 audit (link-rot detector)
        run: |
          cd substrate/hooks/layer8-audit && python layer8_audit.py
          BROKEN_REFS=$(grep -oP "Broken inter-primitive references\s*\|\s*\K\d+" report.md || echo "999")
          BROKEN_HOOKS=$(grep -oP "Broken hook scripts in settings.json\s*\|\s*\K\d+" report.md || echo "999")
          echo "Layer 8: $BROKEN_REFS broken refs, $BROKEN_HOOKS broken hooks"
          # Hard-fail when refs exceed current baseline (46) — class-elimination requires monotonic decrease
          # baseline-bump-reason: 2026-06-10 14:24 ET — public substrate Layer 8 audit confirms 0/0/0/0/0
          # after today's renames + substrate-sync scrub. Setting genuine zero baseline.
          # Note: this CI runs against substrate/ (public mirror), NOT against ~/.claude/projects/.../memory
          # (Will's private local). Public can be cleaner than local because scrub-list excludes
          # NDA/partner-private files that may contain unresolved refs to other NDA-locked siblings.
          BASELINE_REFS=0
          if [ "$BROKEN_REFS" -gt "$BASELINE_REFS" ]; then
            echo "::error::Layer 8 regression: $BROKEN_REFS broken refs > baseline $BASELINE_REFS. Fix or bump baseline with reason."
            head -200 report.md
            exit 1
          fi
          if [ "$BROKEN_HOOKS" -ne "0" ]; then
            echo "::error::Layer 8: $BROKEN_HOOKS broken hook scripts in settings.json. Must be 0."
            exit 1
          fi

  hook-smoke-tests:
    name: Python hook smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: pip install pytest
      - name: Run hook smoke tests
        run: cd substrate/hooks && pytest tests/ -v --tb=short

  rust-hooks:
    name: Rust hooks (hooks-rs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: cd substrate/hooks-rs && cargo build --release
      - name: Run smoke tests
        run: cd substrate/hooks-rs && cargo test --release
