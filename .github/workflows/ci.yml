name: JARVIS substrate CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  yaml-self-validate:
    name: CI workflow YAML self-validates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate this workflow YAML
        run: python -c "import yaml; yaml.safe_load(open('.github/workflows/ci.yml')); print('CI workflow YAML parses clean.')"

  verify-corpus:
    name: Verify primitive corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify primitive corpus integrity
        run: python verify/verify_primitive_corpus.py
      - name: Verify no secrets leaked
        run: python verify/verify_no_secrets.py

  layer8-audit:
    name: Layer 8 link-rot audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Layer 8 audit (link-rot detector)
        run: |
          cd substrate/hooks/layer8-audit && python layer8_audit.py
          BROKEN_REFS=$(grep -oP "Broken inter-primitive references\s*\|\s*\K\d+" report.md || echo "999")
          BROKEN_HOOKS=$(grep -oP "Broken hook scripts in settings.json\s*\|\s*\K\d+" report.md || echo "999")
          echo "Layer 8: $BROKEN_REFS broken refs, $BROKEN_HOOKS broken hooks"
          # Hard-fail when refs exceed current baseline (46) — class-elimination requires monotonic decrease
          # Baseline tracks honest current state; bump only when new primitive churn intentionally adds unresolved
          # refs to siblings shipped same-session. Goal: monotonic-or-zero regression class-eliminated.
          BASELINE_REFS=52
          if [ "$BROKEN_REFS" -gt "$BASELINE_REFS" ]; then
            echo "::error::Layer 8 regression: $BROKEN_REFS broken refs > baseline $BASELINE_REFS. Fix or bump baseline with reason."
            head -200 report.md
            exit 1
          fi
          if [ "$BROKEN_HOOKS" -ne "0" ]; then
            echo "::error::Layer 8: $BROKEN_HOOKS broken hook scripts in settings.json. Must be 0."
            exit 1
          fi

  hook-smoke-tests:
    name: Python hook smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: pip install pytest
      - name: Run hook smoke tests
        run: cd substrate/hooks && pytest tests/ -v --tb=short

  rust-hooks:
    name: Rust hooks (hooks-rs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: cd substrate/hooks-rs && cargo build --release
      - name: Run smoke tests
        run: cd substrate/hooks-rs && cargo test --release
